# WebSSH 反向代理示例：TLS 终结、限流、WebSocket 升级、请求 ID 透传
# 放置到 /etc/nginx/conf.d/webssh.conf，按需替换域名与证书路径

limit_req_zone $binary_remote_addr zone=webssh_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webssh_api:10m rate=300r/m;

upstream webssh_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name ssh.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ssh.example.com;

    ssl_certificate     /etc/ssl/certs/ssh.example.com.crt;
    ssl_certificate_key /etc/ssl/private/ssh.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;
    server_tokens off;

    # 登录与二次认证：单独收紧
    location = /api/login {
        limit_req zone=webssh_login burst=5 nodelay;
        proxy_pass http://webssh_backend;
        include /etc/nginx/proxy_params_webssh.conf;
    }

    location = /api/step-up {
        limit_req zone=webssh_login burst=5 nodelay;
        proxy_pass http://webssh_backend;
        include /etc/nginx/proxy_params_webssh.conf;
    }

    location /api/ {
        limit_req zone=webssh_api burst=60 nodelay;
        proxy_pass http://webssh_backend;
        include /etc/nginx/proxy_params_webssh.conf;
    }

    location = /metrics {
        # 指标只允许监控网段访问
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://webssh_backend;
        include /etc/nginx/proxy_params_webssh.conf;
    }

    location / {
        proxy_pass http://webssh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # 终端是长连接：关闭缓冲，放宽超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
